# Lifecycle sweep — manual trigger only.
#
# This ran on a `schedule:` every five minutes until 2026-09-04. GitHub queues
# scheduled workflows best-effort, and in practice this one fired about four
# hours apart rather than every five minutes, which defeats the point: an
# unpaid slot would hold a seat until whenever the next run happened to land.
#
# The five-minute cadence now comes from an external scheduler (cron-job.org)
# posting to the same endpoint with the same CRON_SECRET. vercel.json keeps a
# once-daily cron as a last-resort backstop.
#
# What remains here is the manual button: force a sweep from the Actions tab
# without waiting for a tick or reaching for curl.
#
# Required repository secrets:
#   SWEEP_URL     https://<your-app>.vercel.app/api/cron/expire
#   CRON_SECRET   the same value set in the Vercel project
name: Lifecycle sweep

on:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Run expiry and completion sweep
        run: |
          if [ -z "${{ secrets.SWEEP_URL }}" ]; then
            echo "SWEEP_URL secret is not set; nothing to call."
            exit 1
          fi
          response=$(curl -sS -o /tmp/body -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SWEEP_URL }}")
          echo "HTTP $response"
          cat /tmp/body
          echo
          # A non-2xx means the sweep did not run; fail loudly rather than
          # silently leaving slots and holds outstanding.
          [ "$response" -ge 200 ] && [ "$response" -lt 300 ]
