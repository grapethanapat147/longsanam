# เทสทุก push และทุก PR
#
# เหตุผลที่มี: วันที่ 19–20 ก.ย. 2569 เจอบั๊กสี่ตัวบนเบราว์เซอร์ที่เทส 400 กว่าข้อ
# มองไม่เห็น (LSN-0044 · LSN-0045) ทุกตัวแก้แล้วและมีตัวเฝ้าแล้ว แต่ตัวเฝ้าจะมี
# ความหมายก็ต่อเมื่อมีเครื่องรันให้ทุกครั้ง ไม่ใช่รอให้คนนึกได้
#
# แบ่งเป็นสองงานตามของที่ต้องใช้:
#
#   verify       ไม่ต้องพึ่งอะไรเลย จบใน ~1 นาที — รู้ผลเร็วสุด
#   integration  ต้องมี Supabase ในเครื่องรัน + เบราว์เซอร์จริง จึงช้ากว่ามาก
#
# แยกกันเพื่อให้ความผิดพลาดที่พบบ่อยที่สุด (lint · type · ตรรกะ) แดงภายในนาทีแรก
# แทนที่จะต้องรอ Docker ดึงอิมเมจให้เสร็จก่อน

name: CI

on:
  push:
    branches: [main]
  pull_request:

# push ซ้อนกันสองครั้งไม่ต้องรันทั้งคู่ เอาอันล่าสุดพอ
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run verify

  integration:
    name: pgTAP · E2E
    runs-on: ubuntu-latest
    # ยาวได้แต่ไม่ควรค้างทั้งวันถ้า Docker มีปัญหา
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: เปิด Supabase ในเครื่องรัน
        run: supabase start

      - name: เขียน .env.local จากค่าที่ Supabase เพิ่งพิมพ์ออกมา
        run: node scripts/write-ci-env.mjs

      - name: pgTAP
        run: npm run test:db

      - name: ติดตั้งเบราว์เซอร์ของ Playwright
        run: npx playwright install --with-deps chromium

      # `npm run e2e` รีเซ็ตฐานข้อมูลเองก่อนเสมอ เพราะ pgTAP ข้างบนเพิ่งเขียนข้อมูลทิ้งไว้
      # และตัว config ก็ build + start ให้เอง (ไม่ใช้ dev server — ดูเหตุผลใน playwright.config.ts)
      - name: E2E
        run: npm run e2e

      - name: เก็บร่องรอยไว้ดูเมื่อแดง
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
